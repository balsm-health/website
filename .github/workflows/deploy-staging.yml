name: Deploy to Staging (Cloudflare Workers)

# Deploys the OpenNext build to the staging Worker (balsm-website-staging)
# served at https://stg.balsm.health on every push to the `staging` branch.
# Also runnable on demand from the Actions tab.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & deploy to staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, matching the lockfile's resolver (npm 10
          # on Node 20 re-resolves an optional @swc/helpers peer and breaks
          # `npm ci`). Node 20 is also deprecated on GitHub runners.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy (OpenNext -> Workers, --env staging)
        run: npm run deploy:staging
        env:
          # Cloudflare auth (reused from the existing deploy setup)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public build-time vars
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Optional: enables Sentry sourcemap upload when present
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
